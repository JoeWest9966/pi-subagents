name: Agent 1426 workspace

on:
  push:
    branches:
      - feat/external-cli-adapters-1426
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source snapshot
        shell: bash
        run: |
          git archive --format=zip --output=pi-subagents-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pi-subagents-source
          path: pi-subagents-source.zip
          if-no-files-found: error
          retention-days: 1
